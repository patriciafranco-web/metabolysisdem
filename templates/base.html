<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metabolisys - Sistema Clinico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #121212 !important;
            color: #e9ecef;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .brand-mark {
            color: #e63946;
            letter-spacing: 0.04em;
        }
        .top-bar {
            background-color: #181818 !important;
            border-bottom: 1px solid #2f2f2f;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark top-bar shadow-sm py-2">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center flex-wrap gap-2">

            <div class="d-flex align-items-center my-1">
                <a href="{{ url_for('index') }}" class="text-decoration-none d-flex align-items-center me-3">
                    <i class="bi bi-heart-pulse-fill text-danger fs-4 me-2"></i>
                    <span class="brand-mark fw-bold fs-5">Metabolisys</span>
                </a>
                <div class="border-start border-secondary ps-3 text-warning fw-semibold fs-6">
                    {% if session.get('user_name') %}
                        {{ session.get('user_name') }}
                    {% else %}
                        Sistema Clinico Metabolico
                    {% endif %}
                </div>
            </div>

            {% if session.get('user_id') %}
            <div class="d-flex align-items-center my-1 gap-3">
                <span class="text-light small">
                    <i class="bi bi-person-circle text-warning me-1"></i>
                    <b>{{ session.get('username') }}</b>
                </span>
                <a href="{{ url_for('logout') }}" class="btn btn-outline-danger btn-sm fw-semibold">
                    <i class="bi bi-box-arrow-right me-1"></i> Salir
                </a>
            </div>
            {% endif %}

        </div>
    </nav>

    <div class="container my-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
