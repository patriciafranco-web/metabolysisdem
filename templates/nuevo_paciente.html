<!-- SECCIÓN: Datos Personales del Paciente Pediátrico -->
<div class="card mb-4">
    <div class="card-header bg-primary text-white">
        <h5>Datos del Paciente y Contacto</h5>
    </div>
    <div class="card-body">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="nombre" class="form-label">Nombre y Apellido del Niño/a</label>
                <input type="text" class="form-control" id="nombre" name="nombre" required>
            </div>
            <div class="col-md-3 mb-3">
                <label for="fecha_nacimiento" class="form-label">Fecha de Nacimiento</label>
                <input type="date" class="form-control" id="fecha_nacimiento" name="fecha_nacimiento" required>
            </div>
            <div class="col-md-3 mb-3">
                <label for="sexo" class="form-label">Sexo</label>
                <select class="form-select" id="sexo" name="sexo">
                    <option value="Masculino">Masculino</option>
                    <option value="Femenino">Femenino</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="nombre_padre_madre" class="form-label">Madre / Padre / Tutor</label>
                <input type="text" class="form-control" id="nombre_padre_madre" name="nombre_padre_madre">
            </div>
            <div class="col-md-6 mb-3">
                <label for="telefono" class="form-label">Teléfono de Contacto</label>
                <input type="text" class="form-control" id="telefono" name="telefono">
            </div>
        </div>
    </div>
</div>

<!-- SECCIÓN: Antecedentes Perinatales y Neonatales -->
<div class="card mb-4">
    <div class="card-header bg-info text-white">
        <h5>Antecedentes Perinatales (Neonatología)</h5>
    </div>
    <div class="card-body">
        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="semanas_gestacion" class="form-label">Semanas de Gestación</label>
                <input type="number" class="form-control" id="semanas_gestacion" name="semanas_gestacion" placeholder="Ej: 38">
            </div>
            <div class="col-md-4 mb-3">
                <label for="peso_nacimiento" class="form-label">Peso al Nacer (kg)</label>
                <input type="number" step="0.01" class="form-control" id="peso_nacimiento" name="peso_nacimiento" placeholder="Ej: 3.250">
            </div>
            <div class="col-md-4 mb-3">
                <label for="talla_nacimiento" class="form-label">Talla al Nacer (cm)</label>
                <input type="number" step="0.1" class="form-control" id="talla_nacimiento" name="talla_nacimiento" placeholder="Ej: 50.5">
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="apgar" class="form-label">Score de Apgar</label>
                <input type="text" class="form-control" id="apgar" name="apgar" placeholder="Ej: 8 / 9">
            </div>
            <div class="col-md-8 mb-3">
                <label for="antecedentes_maternos" class="form-label">Antecedentes Maternos / Embarazo</label>
                <input type="text" class="form-control" id="antecedentes_maternos" name="antecedentes_maternos" placeholder="Diabetes gestacional, infecciones, etc.">
            </div>
        </div>
        <div class="row">
            <div class="col-md-12 mb-3">
                <label for="diagnostico_fetal" class="form-label">Ecocardiografía Fetal Previa</label>
                <input type="text" class="form-control" id="diagnostico_fetal" name="diagnostico_fetal" placeholder="Resultados o comentarios de eco fetal si la hubo">
            </div>
        </div>
    </div>
</div>

<!-- SECCIÓN: Clasificación Cardiológica -->
<div class="card mb-4">
    <div class="card-header bg-success text-white">
        <h5>Clasificación Cardiológica Inicial</h5>
    </div>
    <div class="card-body">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="tipo_cardiopatia" class="form-label">Tipo de Cardiopatía</label>
                <select class="form-select" id="tipo_cardiopatia" name="tipo_cardiopatia">
                    <option value="Sin Cardiopatía">Sin Cardiopatía / Normal</option>
                    <option value="No Cianótica">No Cianótica</option>
                    <option value="Cianótica">Cianótica</option>
                    <option value="En Estudio">En Estudio / Dudosa</option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label for="patologia_principal" class="form-label">Patología Principal</label>
                <input type="text" class="form-control" id="patologia_principal" name="patologia_principal" placeholder="Ej: CIV perimembranosa, Ductus persistente...">
            </div>
        </div>
    </div>
</div>
