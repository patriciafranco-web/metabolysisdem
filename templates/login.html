<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Metabolisys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #121212 !important;
            color: #e9ecef;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background-color: #1e1e1e !important;
            border: 1px solid #333 !important;
            color: #ffffff !important;
            border-radius: 12px;
        }
        .form-control {
            background-color: #2a2a2a !important;
            border: 1px solid #444 !important;
            color: #ffffff !important;
        }
        .form-control:focus {
            background-color: #323232 !important;
            border-color: #e63946 !important;
            color: #ffffff !important;
            box-shadow: 0 0 0 0.2rem rgba(230, 57, 70, 0.2) !important;
        }
        .form-control::placeholder {
            color: #9aa0a6;
        }
        .brand-heading {
            color: #e63946;
            letter-spacing: 0.05em;
        }
        .btn-login {
            background-color: #e63946;
            border: none;
            font-weight: 600;
        }
        .btn-login:hover {
            background-color: #d90429;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100 px-3">
    <div class="card login-card shadow-lg p-4" style="width: 100%; max-width: 400px;">
        <div class="card-body text-center">
            <h3 class="brand-heading fw-bold mb-1">
                <i class="bi bi-heart-pulse-fill me-1"></i> METABOLISYS
            </h3>
            <p class="text-secondary small mb-4">Sistema Clinico Diabetologico y Metabolico</p>

            {% if error %}
            <div class="alert alert-danger py-2 small text-start" role="alert">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST">
                <div class="mb-3 text-start">
                    <label class="form-label fw-semibold small text-light">Usuario</label>
                    <input type="text" class="form-control" name="username" placeholder="Ingrese su usuario" autocomplete="username" required>
                </div>
                <div class="mb-4 text-start">
                    <label class="form-label fw-semibold small text-light">Contrasena</label>
                    <input type="password" class="form-control" name="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-danger btn-login w-100 py-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar al Sistema
                </button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
