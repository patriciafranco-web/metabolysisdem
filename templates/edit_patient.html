{% extends "base.html" %}
{% block content %}
<div class="container pb-5" style="max-width: 900px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <a href="{{ url_for('patient_detail', id=patient.id) }}" class="btn btn-secondary btn-sm">⬅️ Volver al Perfil</a>
        <h2 class="text-warning fw-bold m-0">📋 Plan Médico y Tratamiento</h2>
    </div>

    <div class="card p-4 shadow-sm" style="background-color: #1e1e1e; border: 1px solid #333;">
        <h5 class="text-info mb-3">Paciente: {{ patient.full_name }} (CI: {{ patient.ci }})</h5>
        
        <form method="POST" action="{{ url_for('edit_treatment', patient_id=patient.id) }}" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label text-light fw-bold">📌 Indicaciones Terapéuticas / Plan a Seguir</label>
                <textarea class="form-control bg-dark text-white border-secondary" name="indicaciones_tratamiento" rows="5" placeholder="Escriba el plan médico, pautas nutricionales o indicaciones generales...">{{ record.indicaciones_tratamiento if record else '' }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label text-light fw-bold">💊 Medicación Recetada</label>
                <textarea class="form-control bg-dark text-white border-secondary" name="medications" rows="3" placeholder="Detalle los fármacos, dosis y frecuencias...">{{ record.medications if record else '' }}</textarea>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label text-light">Próximo Control</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" name="proximo_control" value="{{ record.proximo_control if record else '' }}" placeholder="Ej. 1 mes, 3 meses...">
                </div>
                <div class="col-md-6">
                    <label class="form-label text-light">Conducta Médica</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" name="conducta_medica" value="{{ record.conducta_medica if record else '' }}" placeholder="Ej. Derivación, estudios pendientes...">
                </div>
            </div>

            <div class="card bg-black border-secondary p-3 mb-4">
                <h6 class="text-danger mb-3">📸 Adjuntar Estudio o Foto Complementaria</h6>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label text-light">Categoría</label>
                        <select class="form-select bg-dark text-white border-secondary" name="photo_category">
                            <option value="Evolución">Control / Evolución</option>
                            <option value="Estudios / Ecografía">Estudio / Ecografía / TAC</option>
                            <option value="Antes">Foto Inicial (Antes)</option>
                            <option value="Después">Resultado Final (Después)</option>
                        </select>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label text-light">Seleccionar Archivo / Imagen</label>
                        <input type="file" class="form-control bg-dark text-white border-secondary" name="photo" accept="image/*,.pdf">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label text-light">Notas del Archivo</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary" name="photo_notes" placeholder="Ej. Ecografía...">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-warning fw-bold text-dark w-100 py-3 mt-2 fs-5">💾 Guardar Plan y Tratamiento</button>
        </form>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    var form = document.querySelector("form");
    if(form) {
        form.addEventListener("submit", function(e) {
            var btn = form.querySelector("button[type='submit']");
            if(btn) {
                btn.innerHTML = "⏳ Guardando, por favor espere...";
                btn.classList.add("disabled");
                btn.style.pointerEvents = "none";
            }
        });
    }
});
</script>
{% endblock %}
