{% extends "base.html" %}
{% block content %}
<div class="container pb-5" style="max-width: 950px;">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <a href="{{ url_for('patient_detail', id=patient.id) }}" class="btn btn-outline-secondary btn-sm">Volver al Perfil</a>
        <h2 class="text-warning fw-bold m-0 fs-4">Editar Datos del Paciente</h2>
    </div>

    <div class="card p-4 shadow-sm" style="background-color: #1e1e1e; border: 1px solid #333;">
        <h5 class="text-info mb-3">{{ patient.full_name }}</h5>

        <form method="POST" action="{{ url_for('edit_patient', id=patient.id) }}">
            <h6 class="text-warning fw-bold mb-3">Datos Personales y Filiación</h6>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label text-light">Nombre Completo</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" name="full_name" value="{{ patient.full_name or '' }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-light">Cédula (CI)</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" name="ci" value="{{ patient.ci or '' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label text-light">Sexo</label>
                    <select class="form-select bg-dark text-white border-secondary" name="gender">
                        <option value="Mujer" {% if patient.gender == 'Mujer' %}selected{% endif %}>Mujer</option>
                        <option value="Hombre" {% if patient.gender == 'Hombre' %}selected{% endif %}>Hombre</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label text-light">Fecha de Nacimiento</label>
                    <input type="date" class="form-control bg-dark text-white border-secondary" name="birth_date" value="{{ patient.birth_date or '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label text-light">Edad (años)</label>
                    <input type="number" class="form-control bg-dark text-white border-secondary" name="age" value="{{ patient.age or '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label text-light">Teléfono</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" name="phone" value="{{ patient.phone or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label text-light">Sanatorio / Consultorio</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" name="sanatorio" value="{{ patient.sanatorio or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label text-light">Procedencia</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" name="procedencia" value="{{ patient.procedencia or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label text-light">Profesión</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" name="profession" value="{{ patient.profession or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label text-light">Seguro Médico</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" name="seguro_medico" value="{{ patient.seguro_medico or '' }}">
                </div>
            </div>

            <h6 class="text-warning fw-bold mb-3">Antecedentes y Contexto Clínico</h6>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label text-light">Patología Principal</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" name="pathology_type" value="{{ patient.pathology_type or '' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label text-light">Años de Evolución</label>
                    <input type="number" class="form-control bg-dark text-white border-secondary" name="evolution_years" value="{{ patient.evolution_years or '' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label text-light">Inicio Tratamiento</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" name="fecha_inicio_tratamiento" value="{{ patient.fecha_inicio_tratamiento or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label text-light">Comorbilidades</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" name="comorbidities" value="{{ patient.comorbidities or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label text-light">Tratamiento Base</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" name="tratamiento_base" value="{{ patient.tratamiento_base or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label text-light">Antecedentes Personales</label>
                    <textarea class="form-control bg-dark text-white border-secondary" name="antecedentes_personales" rows="2">{{ patient.antecedentes_personales or '' }}</textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-light">Antecedentes Familiares</label>
                    <textarea class="form-control bg-dark text-white border-secondary" name="antecedentes_familiares" rows="2">{{ patient.antecedentes_familiares or '' }}</textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-light">Cirugías Previas</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" name="historial_cirugias" value="{{ patient.historial_cirugias or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label text-light">Alergia a Fármacos</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" name="alergia_farmacos" value="{{ patient.alergia_farmacos or '' }}">
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="{{ url_for('patient_detail', id=patient.id) }}" class="btn btn-secondary px-4">Cancelar</a>
                <button type="submit" class="btn btn-warning fw-bold text-dark px-4">Guardar Datos del Paciente</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
